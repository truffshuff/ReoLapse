name: Release

# Push a tag like v0.1.0 to build the macOS app and publish it as a GitHub Release.
# "Run workflow" (manual) builds it too and keeps the .dmg as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app.nosync
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app.nosync/package-lock.json

      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm ci

      - name: Build the UI and gather the engine source, uv and ffmpeg
        run: npm run build && bash scripts/prepare-release.sh

      - name: Package (ad-hoc signed, not notarized)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --publish never

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app.nosync/release/*.dmg
          body_path: .github/release-notes.md
          generate_release_notes: true

      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: Reolapse-mac-arm64
          path: app.nosync/release/*.dmg
